# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

# Variables de entorno
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = MOZ_ENABLE_WAYLAND, 1
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_QPA_PLATFORM, wayland
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = QT_WAYLAND_DISABLE_WINDOW_DECORATION, 1
env = GDK_SCALE, 1
env = HYPRSHOT_DIR, $HOME/Pictures/Screenshots/

monitor = HDMI-A-1, 1920x1080@60, 0x0, 1.67

exec-once = awww-daemon
exec-once = sleep 0.5 && awww img /home/omega/Imágenes/wallpaper.jpg
exec-once = waybar &
exec-once = $HOME/.config/hypr/scripts/waybar_auto_hide
exec-once = hypridle
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = udiskie --no-automount --smart-tray
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# exec-once = hyprsunset  # descomentar para filtro de luz azul

# Configuraciones generales
general {
  gaps_in = 5
  gaps_out = 20

  border_size = 2

  resize_on_border = true
  allow_tearing = true
  layout = dwindle
}

# dwindle
dwindle {
    smart_split = true
    force_split = 2
    preserve_split = true
    special_scale_factor = 0.8
}


#decorations
decoration {
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
      }
  }

animations {
    enabled = true

    # Curva puramente orgánica y balanceada
    bezier = organic, 0.25, 1, 0.5, 1

    animation = windows, 1, 16, organic, slide
    animation = windowsOut, 1, 14, organic, slide
    animation = workspaces, 1, 14, organic, slide
        animation = fade, 1, 12, default
}

$mainMod = SUPER
$shiftMod = SHIFT_L
$terminal = ghostty
$fileManager = nautilus --ozone-platform=x11
$menu = hyprlauncher
$web = vivaldi
$launcher = rofi --title="rofi" -show drun
$tools = ghostty --title="MENÚ DE HERRAMIENTAS" -e /home/omega/Documentos/programacion/personal-tools/executor.sh
$cliphist = cliphist list | rofi -dmenu -p Clipboard | cliphist decode | wl-copy

bind = $mainMod, T, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, P, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, W, exec, $web
bind = $mainMod, space, exec, $launcher
bind = $mainMod, S, exec, $tools
bind = $mainMod, V, exec, $cliphist

#move focus
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod,k , movefocus, u
bind = $mainMod, j, movefocus, d

# switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, comma, workspace, e-1
bind = $mainMod, period, workspace, e+1


#move active windows whit shift
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse move/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshot a window
bind = $mainMod, PRINT, exec, hyprshot -m window -o $HYPRSHOT_DIR
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output -o $HYPRSHOT_DIR
# Screenshot a region
bind = $shiftMod, PRINT, exec, hyprshot -m region -o $HYPRSHOT_DIR

#especial keybindings
bind = ALT, comma, exec, wtype "<"
bind = ALT, period, exec, wtype ">"

# special workspace for music player

bind = $mainMod, M, togglespecialworkspace, musica
bind = $mainMod $shiftMod, M, movetoworkspace, special:musica

# special workspace for pomodoro timer
bind = $mainMod, N, togglespecialworkspace, pomodoro
bind = $mainMod $shiftMod, N, movetoworkspace, special:pomodoro

#music keybindings
bind = ,F1, exec, rmpc remote keybind "<"
bind = , F2, exec, rmpc remote keybind ">"
bind = , F3, exec,  ~/.config/rmpc/notify-pause.sh
binde = , F4, exec, rmpc remote keybind ","; ~/.config/rmpc/notify-volume.sh 
binde = , F5, exec, rmpc remote keybind "."; ~/.config/rmpc/notify-volume.sh
bind = , F6, exec, ~/.config/rmpc/notify-stop.sh
bind = , F9, exec, ~/Documentos/programacion/jarvis-like/asistente.sh

# Window rules
windowrule = float on, match:title MENÚ DE HERRAMIENTAS
windowrule = center on, match:title MENÚ DE HERRAMIENTAS
windowrule = size 800 600, match:title MENÚ DE HERRAMIENTAS

input {
	kb_layout = latam
}

