general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    hide_cursor = true
    ignore_empty_input = false
}
background {
    path = /home/omega/Imágenes/lockwall.jpg
    blur_passes = 0
    blur_size = 0
}
# Hora
label {
    text = cmd[update:1000] echo "$(date +"%I:%M")"
    color = #e5e5e5
    font_size = 80
    font_family = SF Pro Display Bold
    position = 0, -30
    halign = center
    valign = center
}
# Fecha
label {
    text = cmd[update:1000] echo "$(date +"%A, %d de %B")"
    color = #e5e5e5
    font_size = 20
    font_family = SF Pro Display Bold
    position = 0, 40
    halign = center
    valign = center
}
# Input field
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    inner_color = rgba(30, 30, 30, 1.0)
    outer_color = rgba(33, 246, 188, 1.0)
    font_color = rgba(229, 229, 229, 1.0)
    font_family = SF Pro Display
    placeholder_text = <i>🔒 Ingresá tu contraseña</i>
    hide_input = false
    dots_center = true
    dots_size = 0.3
    dots_spacing = 0.4
    position = 0, 100
    halign = center
    valign = center
    check_color = rgba(33, 246, 188, 1.0)
    fail_color = rgba(255, 112, 146, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
}
